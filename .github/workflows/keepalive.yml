name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake free Render instance + health probe
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 40 https://b2c-cost-calculator.onrender.com/api/health)
          echo "render /api/health responded: $code"