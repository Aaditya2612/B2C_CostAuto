name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake free Render instance
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 40 https://b2c-cost-calculator.onrender.com/)
          echo "render responded: $code"